version: "3.9"

services:
  bda-service:
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - "8002:8000"
    depends_on:
      - bda-db
    volumes:
      - ./src:/app:rw 
    working_dir: /app 
    networks:
      - shared-network
  bda-db:
    image: postgres:latest
    ports:
      - "5002:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - shared-network

  bda-adminer:
    image: adminer
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: bda-db
      ADMINER_DEFAULT_USERNAME: ${DB_USERNAME}
      ADMINER_DEFAULT_PASSWORD: ${DB_PASSWORD}
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - bda-db
    networks:
      - shared-network

volumes:
  bda-data:

networks:
  shared-network:
    external: true
